# Watches scanned on a schedule by .github/workflows/scan.yml
#
# Add one by hand, or paste a Vinted search URL into the web UI, or run:
#   uv run python -m scanner import-url "https://www.vinted.co.uk/catalog?search_text=..."
#
# notify_on: new_listing | price_drop | back_in_stock | went_on_sale

version: 1

defaults:
  notify_on: [new_listing]

watches:
  - id: patagonia-fleece
    label: Patagonia fleece under £60
    platform: vinted
    enabled: true
    notify_on: [new_listing]
    query:
      host: www.vinted.co.uk
      search_text: patagonia fleece
      price_to: 60
      currency: GBP
      order: newest_first
      per_page: 40

  # Shopify storefronts serve an unauthenticated product feed, so price and
  # stock watching needs no scraping.
  # went_on_sale is omitted deliberately: this store leaves compare_at_price
  # empty, so a discount shows up as the price itself falling, not as a
  # compare-at appearing. back_in_stock is the rule most likely to fire here,
  # since most variants are sold-out sizes.
  - id: pwvc-sale
    label: Private White V.C. — price drops and restocks
    platform: shopify
    enabled: true
    notify_on: [price_drop, back_in_stock]
    query:
      base_url: https://privatewhitevc.com
      collection: all
      currency: GBP
      max_products: 250
