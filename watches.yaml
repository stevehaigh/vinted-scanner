# Managed by the scanner UI and by hand. Both are fine.
version: 1
watches:
  - id: pwvc-sale
    label: Private White V.C. — price drops and restocks
    platform: shopify
    enabled: true
    notify_on:
      - price_drop
      - back_in_stock
    query:
      base_url: https://privatewhitevc.com
      collection: all
      currency: GBP
      max_products: 250
